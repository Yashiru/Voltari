name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  placeholder-guard:
    name: No third-party placeholders
    runs-on: ubuntu-latest
    steps:
      # The whole history, not just this commit: a push carries every commit,
      # so a file removed today is still published if it was ever committed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/placeholder-guard/placeholder-guard.mjs

  purity-lint:
    name: Core purity lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/purity-lint/purity-lint.mjs

  content:
    name: Content build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: tools
      - run: npm run content:build
        working-directory: tools
      # The payload is committed so the test suite stays hermetic. Rebuilding it
      # here is what stops it drifting from the YAML it came from.
      - name: Fail if the committed payload is stale
        run: git diff --exit-code content/

  budget:
    name: Asset budget reads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # It measures the committed model fixture, not the roster: the placeholder
      # models never leave one machine (decision 0027), so there is nothing else
      # here to weigh. What this catches is the reporter breaking — it exits
      # non-zero when it reads no triangles at all, which is the one way a
      # budget tool can be actively harmful (decision 0048).
      - name: The budget report still reads a model
        run: node tools/budget/report-budget.mjs tests/fixtures/models

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      # Pinned: a test dependency tracking a moving branch is not reproducible.
      GDUNIT4_VERSION: "6.2.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          BASE="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -sSLO "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${BASE}.zip"
          unzip -q "${BASE}.zip"
          sudo install -m 755 "${BASE}" /usr/local/bin/godot

      - name: Install gdUnit4
        run: |
          curl -sSL -o gdunit4.zip "https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v${GDUNIT4_VERSION}.zip"
          unzip -q gdunit4.zip
          mkdir -p addons
          mv "gdUnit4-${GDUNIT4_VERSION}/addons/gdUnit4" addons/gdUnit4
          chmod +x addons/gdUnit4/runtest.sh

      - name: Import project
        run: godot --headless --import --quit

      # --ignoreHeadlessMode is required: gdUnit4 refuses headless mode by
      # default because UI tests need a display. The core is pure computation,
      # so headless is the correct mode here.
      - name: Run test suite
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: ./addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode --continue -a tests

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore
