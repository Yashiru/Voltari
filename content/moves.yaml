# Moves — authored content, source of truth.
#
# Identifiers are STRUCTURAL PLACEHOLDERS, following the same rule as natures.
# Move names are part of the game's IP and are not derived from any reference;
# naming them is design work, and renaming these is a content edit that touches
# no engine code.
#
# This starter set exists to exercise the pipeline end to end — one entry per
# mechanically distinct shape the engine can currently express. The real roster
# arrives with content design.
#
# Fields:
#   id          stable, snake_case, never reused once published
#   type        must name a type declared in type-chart.yaml
#   category    physical | special | status
#   power       0 for status moves
#   accuracy    percentage, or `always` for moves that skip the check entirely
#               (not the same as 100, which still consults the decider)
#   priority    higher acts first, regardless of speed
#   pp          uses before the move is exhausted

version: 1

moves:
  - id: basic_physical
    type: normal
    category: physical
    power: 40
    accuracy: 100
    priority: 0
    pp: 56

  - id: basic_special
    type: normal
    category: special
    power: 40
    accuracy: 100
    priority: 0
    pp: 40

  # Trades power for reach: the shape used to exercise the accuracy check.
  - id: heavy_physical
    type: normal
    category: physical
    power: 120
    accuracy: 70
    priority: 0
    pp: 8

  # Acts before anything faster. Exercises the priority bracket.
  - id: priority_physical
    type: normal
    category: physical
    power: 40
    accuracy: 100
    priority: 1
    pp: 48

  # Skips the accuracy check rather than rolling 100 — a distinct branch.
  - id: unerring_physical
    type: normal
    category: physical
    power: 60
    accuracy: always
    priority: 0
    pp: 32

  # Typed moves, to exercise STAB, effectiveness and immunity.
  - id: water_special
    type: water
    category: special
    power: 95
    accuracy: 100
    priority: 0
    pp: 24

  - id: ghost_special
    type: ghost
    category: special
    power: 80
    accuracy: 100
    priority: 0
    pp: 24

  - id: ground_physical
    type: ground
    category: physical
    power: 100
    accuracy: 100
    priority: 0
    pp: 16

  # No damage, no behaviour yet: what it would do belongs to the effect system.
  - id: inert_status
    type: normal
    category: status
    power: 0
    accuracy: always
    priority: 0
    pp: 32
